name: Generate Wallpaper Manifest

on:
  push:
    branches:
      - main
    paths:
      - "content/wallpapers/**"
      - "content/thumbnails/**"
      - "scripts/generate_manifest.py"
      - ".github/workflows/generate-manifest.yml"

permissions:
  contents: write

concurrency:
  group: generate-wallpaper-manifest
  cancel-in-progress: false

jobs:
  generate:
    name: Generate Manifest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate manifest
        run: python scripts/generate_manifest.py

      - name: Check for manifest changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- content/manifest.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit generated manifest
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add content/manifest.json

          git commit \
            -m "chore: update wallpaper manifest"

          git push
